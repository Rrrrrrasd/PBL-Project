<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enjoy</title>
    <link rel="stylesheet" href="/css/map_size.css">
    <link rel="stylesheet" href="/css/festival.css">
    <link rel="stylesheet" href="/css/infoWindow.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 왼쪽 패널 -->
            <div class="left-panel bg-light" style="width: 33.33%;">
                <nav id="mainNavbar" class="navbar bg-none flex-column">
                    <div class="w-100 d-flex justify-content-between align-items-center mb-3">
                        <a href="" class="navbar-brand text-primary">ENJOY</a>
                        <div class="loginBtn">
                            <button class="btn btn-primary text-white" id="login">Login</button>
                        </div>
                    </div>
                    <div class="w-100 d-flex justify-content-center">
                        <div class="input-group" style="max-width: 500px;">
                            <input class="form-control" type="text" placeholder="축제 이름, 지역 검색" aria-label="Search">
                            <div class="input-group-append">
                                <button class="search-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-search readingGlass" viewBox="0 0 16 16">
                                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>

                <nav class="menu-list">
                    <button class="kategorie festivalBTN">정보</button>
                    <button class="kategorie hotelBTN">숙소</button>
                    <button class="kategorie restaurantBTN">주변 맛집</button>
                </nav>

                <div class="traffic-info hidden mt-3" id="traffic">
                    <button onclick="trafficInformation()">교통 정보</button>
                </div>

                <!-- 축제 정보 섹션 -->
                <div class="recommendations">
                    <div class="festival-info hidden mt-4" id="festival">
                        <div class="recommendation-item">
                            <div class="recommendationInform">
                                <a href="#" class="more-info">
                                    <img id="festival-image" src="" alt="축제 이미지" class="imageExpand">
                                </a>
                                <div class="">
                                    <div class="w-100 d-flex justify-content-between align-items-center mb-3 px-12">
                                        <button id="festival-title" class="recommendationName"></button>
                                        <button class="btn btn-primary text-white" id="Directions">길찾기</button>
                                    </div>
                                    <p id="festival-address" class="evaluation">주소 정보</p>
                                    <div>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-calendar-event" viewBox="0 0 16 16">
                                            <path d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
                                            <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
                                        </svg>
                                        <span id="festival-dates" class="evaluation">날짜 정보</span>
                                    </div>
                                    <div>
                                        <span id="festival-time" class="evaluation">운영시간</span>
                                    </div>
                                    <div>
                                        <span id="festival-price" class="evaluation">입장금액</span>
                                    </div>
                                    <div class="flex-column">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16">
                                            <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
                                        </svg>
                                        <span id="festival-tel" class="evaluation">전화번호 정보</span>
                                    </div>
                                    <div>
                                        <span id="festival-overview" class="evaluation">개요</span>
                                    </div>
                                    <hr> <!--리뷰, 평점 구분선-->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="hotel-info hidden mt-4" id="hotel">
                        <p class="festivalInformation">숙박 정보</p>
                        <div class="recommendation-item">
                            <div class="recommendationInform">
                                <button class="more-info">
                                    <img src="hotel.jpg" alt="호텔" class="img-fluid">
                                </button>
                                <button class="recommendationName">숙소 샘플</button>
                                <a class="hyperLink" href="">http://www.sample.com/</a>
                                <p class="evaluation">1인 10,000원, 평점 4.2, 리뷰 3</p>
                            </div>
                        </div>
                    </div>
                    <button id="loadMoreHotelsButton">더보기</button>
                    <div class="restaurant-info hidden mt-4" id="restaurant">
                        <p class="festivalInformation">맛집 추천</p>
                        <div class="recomendation-item">
                            <div class="recommendationInform">
                                <button class="more-info">
                                    <img src="restaurant.jpg" alt="음식점" class="img-fluid">
                                </button>
                                <button class="recommendationName">레스토랑 샘플</button>
                                <a class="hyperLink" href="">http://www.sample.com/</a>
                                <p class="evaluation">평점 3.7, 리뷰 120</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 메인 섹션 (지도) -->
            <div class="mapContainer p-0" style="width: 66.67%">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- 외부 JavaScript 파일 추가 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=04ecab24b427d7fdb95d7b0be603cfe6"></script>
    <script src="/js/mapHandler.js"></script>
    <script src="/js/panelHandler.js"></script>
    <script src="/js/InfoMapToPanel.js"></script>
</body>
</html>
