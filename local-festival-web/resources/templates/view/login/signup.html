<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login/signup.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>회원가입</title>
</head>

<body>
    <div class="container-fluid ">
        <div class="d-flex  align-items-center flex-column">

            <form action="/signup" method="POST" class="">
                <div class="text-center mb-4">
                    <a href="/festival" class="navbar-brand text-primary h1">ENJOY</a>
                    <h2 class="h4">회원가입</h2>
                </div>
                <!-- 에러 메시지 -->
			   <div th:if="${errorMessage}" class="alert alert-danger fs-6" >
			        <p th:text="${errorMessage}"></p>
			    </div>

                <div class="form-group">
		        	<label for="userId">아이디</label>
			        <input type="text" id="userId" name="userId" class="form-control" placeholder="아이디 (4~20자)" required pattern=".{4,20}">
			    </div>
			
			    <div class="form-group">
			        <label for="password">비밀번호</label>
			        <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호 (최소 8자)" required pattern=".{8,}">
			    </div>
			
			    <div class="form-group">
			        <label for="username">닉네임</label>
			        <input type="text" id="username" name="username" class="form-control" placeholder="닉네임 (최대 10자)" required pattern=".{1,10}">
			    </div>
			
			    <div class="form-group">
			        <label for="email">이메일</label>
			        <input type="email" id="email" name="email" class="form-control" placeholder="이메일" required>
			    </div>
			
			    <div class="form-group">
			        <label for="birthdate">생년월일</label>
			        <input type="date" id="birthdate" name="birthdate" class="form-control" required>
			    </div>
			
			    <div class="form-group">
			        <label for="gender">성별</label>
			        <select id="gender" name="gender" class="form-control" required>
			            <option value="male">남성</option>
			            <option value="female">여성</option>
			        </select>
			    </div>
			
			    <button type="submit" class="btn btn-primary">가입하기</button>
            </form>
            
        </div>
    </div>

</body>

</html>
