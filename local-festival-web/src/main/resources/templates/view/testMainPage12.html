<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enjoy</title>
    <link rel="stylesheet" href="/css/map_size.css">
    <link rel="stylesheet" href="/css/festival.css">
    <link rel="stylesheet" href="/css/infoWindow.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 왼쪽 패널 -->
            <div class="left-panel bg-light" style="width: 33.33%;">
                <nav id="mainNavbar" class="navbar bg-none flex-column">
                    <div class="w-100 d-flex justify-content-between align-items-center mb-3">
                        <a href="" class="navbar-brand text-primary">ENJOY</a>

                        <!--  
                        <div>
						    Authentication Name: <span th:text="${#authentication.name}"></span>
						</div>
						-->
                        
                        <div class="loginBtn">
	                        <div th:if="${#authentication.name == 'anonymousUser'}">
	                            <a class="btn" href="/login" id="signIn">Sign in</a>
	                            <a class="btn btn-primary text-white" href="/signup">Sign up</a>
	                        </div>
	                        <div th:if="${#authentication.name != 'anonymousUser'}">
					            <!-- 로그인한 사용자 -->
					            <a th:href="@{/mypage}" class="btn btn-primary text-white">My Page</a>
					            <a th:href="@{/logout}" class="btn">Logout</a>
					        </div>
	                    
	                     </div>
                    </div>

                    <div class="w-100 d-flex justify-content-center">
                        <div class="input-group" style="max-width: 500px;">

                            <div class="input-group-append">
                                <button class="search-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"

                                    </svg>
                                </button>

                <nav class="menu-list">

                    <div class="kategorie festivalBTN">축제</div>
                    <div class="kategorie hotelBTN">숙소</div>
                    <div class="kategorie restaurantBTN">주변 음식점</div>
                </nav>

                <div class="traffic-info hidden mt-3" id="traffic">
                    <button onclick="trafficInformation()">교통 정보</button>
                </div>

                <hr class="gray-line">

                <!-- 축제 정보 섹션 -->
                <div class="recommendations">
                    <div class="festival-info hidden mt-4" id="festival">
                        <!-- 패널의 내용을 동적으로 업데이트하기 위한 코드 변경-->
                        <div class="recommendationInform">
                            <!-- 패널의 내용을 동적으로 업데이트하기 위한 id 값을 유지 -->
                            <div href="#" class="infoImage">
                                <img id="festival-image" src="" alt="축제 이미지" class="imageExpand">
                            </div>

                            <div class="">
                                <div class="w-100 d-flex justify-content-between align-items-center mb-3 px-12">
                                    <a id="festival-title" class="recommendationName"></a>
                                    <button class="btn btn-primary text-white" id="Directions">길찾기</button>
                                </div>

                                <div id="festa-data"> <!--축제 안내 데이터  정보-->
                                    <div class="festa-magin" id="festa-location">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                                            <path
                                                d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6" />
                                        </svg>
                                        <span id="festival-address" class="evaluation">주소 정보</span>
                                    </div>
                                    <div class="festa-magin" id="festa-period"> <!--축제 진행 기간-->
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-calendar-event" viewBox="0 0 16 16">
                                            <path
                                                d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
                                            <path
                                                d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
                                        </svg>
                                        <span id="festival-dates" class="evaluation">날짜 정보</span>
                                    </div>
                                    <div class="festa-magin" id="festa-time">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-clock" viewBox="0 0 16 16">
                                            <path
                                                d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z" />
                                            <path
                                                d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0" />
                                        </svg>
                                        <span id="festival-time" class="evaluation">운영시간</span>
                                    </div>
                                    <div class="festa-magin" id="festa-price">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            fill="currentColor" class="bi bi-cash-coin" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd"
                                                d="M11 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8m5-4a5 5 0 1 1-10 0 5 5 0 0 1 10 0" />
                                            <path
                                                d="M9.438 11.944c.047.596.518 1.06 1.363 1.116v.44h.375v-.443c.875-.061 1.386-.529 1.386-1.207 0-.618-.39-.936-1.09-1.1l-.296-.07v-1.2c.376.043.614.248.671.532h.658c-.047-.575-.54-1.024-1.329-1.073V8.5h-.375v.45c-.747.073-1.255.522-1.255 1.158 0 .562.378.92 1.007 1.066l.248.061v1.272c-.384-.058-.639-.27-.696-.563h-.668zm1.36-1.354c-.369-.085-.569-.26-.569-.522 0-.294.216-.514.572-.578v1.1zm.432.746c.449.104.655.272.655.569 0 .339-.257.571-.709.614v-1.195z" />
                                            <path
                                                d="M1 0a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4.083q.088-.517.258-1H3a2 2 0 0 0-2-2V3a2 2 0 0 0 2-2h10a2 2 0 0 0 2 2v3.528c.38.34.717.728 1 1.154V1a1 1 0 0 0-1-1z" />
                                            <path d="M9.998 5.083 10 5a2 2 0 1 0-3.132 1.65 6 6 0 0 1 3.13-1.567" />
                                        </svg>
                                        <span id="festival-price" class="evaluation">입장금액</span>
                                    </div>
                                    <div class="festa-magin" id="festa-callNum">

                                            fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16">
                                            <path
                                                d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z" />
                                        </svg>
                                        <span id="festival-tel" class="evaluation">전화번호 정보</span>
                                    </div>
                                </div>


                                <div>
                                    <hr>
                                    <span id="festival-overview" class="evaluation">개요</span>
                                </div>

                                <hr> <!--리뷰, 평점 구분선-->

                        </div>
                    </div>

                    <div class="hotel-info hidden mt-4" id="hotel">
                        <p class="festivalInformation">숙박 정보</p>
                        <div class="recommendation-item" id="hotel-list">
                            <div class="recommendationInform">
                                <button class="infoImage">
                                    <img src="hotel.jpg" alt="호텔" class="img-fluid">
                                </button>
                                <a class="recommendationName" href="">숙소 샘플</a>
                                <a class="hyperLink" href="">http://www.sample.com/</a>
                                <p class="evaluation">1인 10,000원, 평점 4.2, 리뷰 3</p>
                            </div>
                        </div>
                        <button class="moreBTN" id="loadMoreHotelsButton">더보기</button>
                    </div>



                    <div class="restaurant-info hidden mt-4" id="restaurant">
                        <p class="festivalInformation">맛집 추천</p>
                        <div class="recomendation-item" id="restaurant-list">
                            <div class="recommendationInform">
                                <button class="infoImage">
                                    <img src="restaurant.jpg" alt="음식점" class="img-fluid">
                                </button>
                                <button class="recommendationName">레스토랑 샘플</button>
                                <a class="hyperLink" href="">http://www.sample.com/</a>
                                <p class="evaluation">평점 3.7, 리뷰 120</p>
                            </div>
                        </div>
                        <button class="moreBTN" id="loadMoreRestaurantsButton">더보기</button>
                    </div>
                </div>
            </div>

            <!-- 메인 섹션 (지도) -->
            <div class="mapContainer p-0" style="width: 66.67%">

                <!-- 지도 생성 스크립트 -->
                <div id="map"></div>

                <!-- Kakao Maps API 스크립트 -->
                <script type="text/javascript"
                    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=04ecab24b427d7fdb95d7b0be603cfe6"></script>

                <!-- JavaScript 코드 삽입 위치 -->
                <script>
                    //밑에 함수는 카테고리 관련 함수이다. 맵과는 무관할 것같지만 마커 클릭시 카테고리 선택 초기화를 위해서 여기에 넣음.
                    // 모든 a 태그를 선택
                    const navButtons = document.querySelectorAll('.kategorie');
                    const festivalNav = document.querySelector('.festivalBTN');

                    // 클릭 이벤트 추가
                    navButtons.forEach(button => {
                        button.addEventListener('click', event => {
                            // 모든 버튼에서 'selected' 클래스 제거
                            navButtons.forEach(btn => btn.classList.remove('selected'));

                            // 클릭된 버튼에 'selected' 클래스 추가
                            event.target.classList.add('selected');
                        });
                    });


                    document.addEventListener('DOMContentLoaded', function () {
                        // 현재 날짜를 yyyyMMdd 형식으로 구합니다.
                        var today = new Date();
                        var todayStr = today.getFullYear() +
                            ('0' + (today.getMonth() + 1)).slice(-2) +
                            ('0' + today.getDate()).slice(-2);

                        console.log('Today:', todayStr);


                        // API를 호출하여 데이터를 가져옴
                        fetch('/api/festivals/all')
                            .then(response => response.json()) // 응답을 JSON으로 변환

                            .then(festivals => {
                                console.log('Parsed festivals data:', festivals);

                                // Kakao 지도 설정
                                var mapContainer = document.getElementById('map');
                                var mapOption = {
                                    center: new kakao.maps.LatLng(36.5, 127.5),
                                    level: 12
                                };
                                var map = new kakao.maps.Map(mapContainer, mapOption);

                                //API로 받은 데이터를 지도에 마커로 표시
                                festivals.forEach(function (festival) {
                                    var mapy = parseFloat(festival.mapy);
                                    var mapx = parseFloat(festival.mapx);
                                    var startDate = festival.eventstartdate; // yyyyMMdd 형식
                                    var endDate = festival.eventenddate; // yyyyMMdd 형식

                                    // 현재 날짜가 시작일과 종료일 사이에 있는지 확인
                                    if (todayStr >= startDate && todayStr <= endDate && !isNaN(mapy) && !isNaN(mapx)) {
                                        var markerPosition = new kakao.maps.LatLng(mapy, mapx);
                                        var marker = new kakao.maps.Marker({
                                            position: markerPosition,
                                            map: map // 마커를 지도에 표시
                                        });

                                        // 인포윈도우에 표시할 내용
                                        var infoContent = `
                                            <div class="info-window">
                                                <div style="text-align: center; margin-bottom: 5px;">
                                                    <strong>${festival.title}</strong><br>
                                                </div>
                                                <img src="${festival.firstimage2}" alt="${festival.title}" 
                                                    style="object-fit: contain; width: 100%; max-height: 150px; display: block; margin: 0 auto 3px;">
                                                <div style="padding: 0 10px; text-align: left; margin-top: 3px; word-wrap: break-word; white-space: normal; font-size: 13px;">
                                                    ${festival.addr1}<br>
                                                    <span style="font-size: 12px; color: #555;">${festival.eventstartdate} ~ ${festival.eventenddate}</span>
                                                </div>
                                            </div>
                                        `;


                                        // 인포윈도우 생성
                                        var infowindow = new kakao.maps.InfoWindow({
                                            content: infoContent,
                                            removable: true
                                        });

                                        // 마커에 마우스를 올렸을 때 인포윈도우 표시
                                        kakao.maps.event.addListener(marker, 'mouseover', function () {
                                            infowindow.open(map, marker);
                                        });

                                        // 마커에서 마우스를 뗐을 때 인포윈도우 닫기
                                        kakao.maps.event.addListener(marker, 'mouseout', function () {
                                            infowindow.close();
                                        });

                                        kakao.maps.event.addListener(marker, 'click', function () {
                                            console.log('Marker clicked');  // 마커 클릭 시 호출 확인
                                            console.log('Calling InfoMapToPanel function');  // 함수 호출 로그

                                            // 마커의 위치로 지도 중심 이동 및 확대
                                            map.setLevel(7);
                                            map.panTo(markerPosition);

                                            // 마커 클릭 시 축제 정보를 패널에 업데이트하는 함수 호출
                                            InfoMapToPanel(festival);  // 이 함수에서 축제 정보가 패널에 표시되도록 처리

                                            // 모든 버튼에서 'selected' 클래스 제거
                                            navButtons.forEach(btn => btn.classList.remove('selected'));

                                            // 클릭된 버튼에 'selected' 클래스 추가
                                            festivalNav.classList.add('selected');

                                        });



                                    }
                                });
                            })
                            .catch(error => {
                                console.error('Error fetching festivals data:', error);
                            });
                    });
                </script>
            </div>
        </div>
    </div>

    <!-- JavaScript 코드 추가 -->
    <script>
        // 모든 버튼 및 정보 요소 선택
        const leftPanel = document.querySelector(".left-panel");
        const rightPanel = document.querySelector(".mapContainer");
        const recomendation = document.querySelector(".recommendation");
        const festivalBTN = document.querySelector(".festivalBTN");
        const festivalInfo = document.getElementById("festival");
        const trafficInfo = document.getElementById("traffic");
        const hotelBTN = document.querySelector(".hotelBTN");
        const hotelInfo = document.getElementById("hotel");
        const restaurantBTN = document.querySelector(".restaurantBTN");
        const restaurantInfo = document.getElementById("restaurant");

        //왼쪽 패널 확장을 위한 사진버튼 요소 선택 셀렉터올로 하면 카테고리 버튼을 눌러도 아무 액션을 안함..
        const moreINfo = document.querySelector(".infoImage");


        // 모든 정보 요소들을 배열로 묶음
        const infoSections = [festivalInfo, trafficInfo, hotelInfo, restaurantInfo];
        //각 카테고리별 사진 버튼을 눌렀을 때의 이벤트리스너 생성

        //사진버튼 클릭시 왼쪽 패널 확대
        moreINfo.addEventListener('click', () => {
            leftPanel.classList.add('expanded');
            if (leftPanel.style.width === '33.33%') { // col-md-4
                leftPanel.style.width = '58.33%'; // col-md-7
                rightPanel.style.width = '41.67%'; // col-5
            } else {
                leftPanel.style.width = '33.33%'; // col-md-4
                rightPanel.style.width = '66.67%'; // col-8
            }
        });


        // 공통 함수: 모든 정보 숨기기
        function hideAllInfo() {
            infoSections.forEach(info => {
                info.classList.add('hidden'); // 모든 정보를 숨김
            });
        };

        // 축제 정보 버튼 클릭 이벤트
        festivalBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            festivalInfo.classList.toggle('hidden'); // 축제 정보만 토글
        });

        hotelBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            hotelInfo.classList.toggle('hidden'); // 숙소 정보만 토글
        });

        restaurantBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            restaurantInfo.classList.toggle('hidden'); // 음식점 정보만 토글
        });
    </script>

    <!--카테고리 선택시 사용자가 인지하기 편하게 파란색 유지하는 함수-->
    <script>
        /*

        const navButtons = document.querySelectorAll('.kategorie');

        navButtons.forEach(button => {
            button.addEventListener('click', event => {
                // 모든 버튼에서 'selected' 클래스 제거
                navButtons.forEach(btn => btn.classList.remove('selected'));

                // 클릭된 버튼에 'selected' 클래스 추가
                event.target.classList.add('selected');
            });
        });
        
        */

    </script>
    <script src="/js/InfoMapToPanel.js"></script>
</body>
