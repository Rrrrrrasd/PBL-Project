<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container">
        <!-- User Profile -->
        <div class="card">
            <div class="card-header">
                <h2>마이페이지</h2>
            </div>
            <div class="card-body profile-info">
            	<h3>내 정보</h3>
                <p><strong>아이디:</strong> <span th:text="${user.userId}"></span></p>
                <p><strong>이메일:</strong> <span th:text="${user.email}"></span></p>
                <p><strong>닉네임:</strong> <span th:text="${user.username}"></span></p>
                <p><strong>생년월일:</strong> <span th:text="${user.birthdate}"></span></p>
                <p><strong>성별:</strong> <span th:text="${user.gender}"></span></p>
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="card">
		    <div class="card-body">
		        <h3>작성한 리뷰</h3>
		        <!-- 리뷰가 있을 경우 표시 -->
		        <ul class="list-unstyled reviews-list" th:if="${#lists.size(reviews) > 0}">
		            <li th:each="review : ${reviews}" class="review-item">
		                <p><strong>리뷰 내용:</strong> <span th:text="${review.reviewText}"></span></p>
		                <p class="review-date"><strong>작성일:</strong> <span th:text="${review.createdAt}"></span></p>
		            </li>
		        </ul>
		        <!-- 리뷰가 없을 경우 메시지 표시 -->
		        <p class="text-center text-muted" th:if="${#lists.size(reviews) == 0}">
		            작성한 리뷰가 없습니다.
		        </p>
		    </div>
		</div>
    </div>
</body>

</html>
