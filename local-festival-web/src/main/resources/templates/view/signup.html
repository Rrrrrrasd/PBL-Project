<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>회원가입</title>
</head>

<body>
    <div class="container-fluid ">
        <div class="d-flex  align-items-center flex-column">

            <form action="/signup" method="POST" class="">
                <div class="navbar-brand justify-content-between">
                    <a href="testMainPage2.html" class="navbar-brand text-primary">ENJOY</a>
                    <h2>회원가입</h2>
                </div>

                <input type="text" id="user_id" name="user_id" placeholder="아이디" required><br><br>

                <input type="password" id="password" name="password" placeholder="비밀번호" required><br><br>

                <input type="password" id="confirm_password" name="confirm_password" placeholder="비밀번호 확인"
                    required><br><br>

                <input type="email" id="email" name="email" placeholder="이메일" required><br><br>

                <input type="text" id="birthdate" name="birthdate" placeholder="생년월일(8자리): YYYYMMDD" pattern="\d{8}"
                    required>

                <select id="gender" name="gender" required>
                    <option value="male">남성</option>
                    <option value="female">여성</option>
                </select><br><br>

                <input type="tel" id="phone" name="phone" placeholder="휴대전화번호" class="input" value maxlength="16"
                    required><br><br>

                <button type="submit">가입하기</button>
            </form>
        </div>
    </div>

</body>

</html>
