                <!-- Kakao Maps API 스크립트 -->
                <script type="text/javascript"

                <!-- JavaScript 코드 삽입 위치 -->
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        // 현재 날짜를 yyyyMMdd 형식으로 구합니다.
                        var today = new Date();
                        window.todayStr = today.getFullYear() +
                            ('0' + (today.getMonth() + 1)).slice(-2) +
                            ('0' + today.getDate()).slice(-2);

                        console.log('Today:', window.todayStr);

                        // 수정 (추가)
                        const grayMarkerImage = new kakao.maps.MarkerImage(
                            '/image/marker_gray.png',
                            new kakao.maps.Size(40, 40)
                        );

                        window.grayMarkerImage = grayMarkerImage;

                        // 수정 (추가)
                        var globalInfowindow = new kakao.maps.InfoWindow({
                            removable: true
                        });

                        // API를 호출하여 데이터를 가져옴
                        fetch('/api/festivals/all')
                            .then(response => response.json()) // 응답을 JSON으로 변환
                            .then(festivals => {
                                console.log('Parsed festivals data:', festivals);

                                // 전역 변수에 축제 데이터 저장
                                window.festivals = festivals;

                                // Kakao 지도 설정
                                var mapContainer = document.getElementById('map');
                                var mapOption = {
                                    center: new kakao.maps.LatLng(36.5, 127.5),
                                    level: 12
                                };
                                var map = new kakao.maps.Map(mapContainer, mapOption);

                                // 전역 map 객체에 마커 배열 저장
                                window.map = {
                                    map: map,
                                    markers: []
                                };

                                // 축제 데이터를 지도에 마커로 표시
                                festivals.forEach(function (festival) {
                                    var mapy = parseFloat(festival.mapy);
                                    var mapx = parseFloat(festival.mapx);
                                    var startDate = festival.eventstartdate; // "YYYYMMDD"
                                    var endDate = festival.eventenddate; // "YYYYMMDD"

                                    // 날짜 형식이 올바른지 확인
                                    if (!startDate || !endDate || isNaN(mapy) || isNaN(mapx)) {
                                        return; // 유효하지 않은 데이터는 건너뜀
                                    }

                                    // 여기서부터 수정
                                    // 모든 축제 마커를 추가하고, 초기 가시성 설정
                                    var markerPosition = new kakao.maps.LatLng(mapy, mapx);

                                    var isOngoing = (window.todayStr >= startDate) && (window.todayStr <= endDate);
                                    
                                    var marker = new kakao.maps.Marker({
                                        position: markerPosition,
                                        map: map,
                                        image: isOngoing ? null : window.grayMarkerImage
                                    });

                                    marker.setVisible(isOngoing);

                                    // 마커 객체에 축제 데이터 추가
                                    marker.festivalData = festival;

                                    // 전역 배열에 마커 추가
                                    window.map.markers.push(marker);

                                    // 인포윈도우에 표시할 내용
                                    var infoContent = `<div class="info-window" style="max-width: 250px; margin: 0 auto; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);">
                                        <div style="text-align: center; margin-bottom: 5px;">
                                            <strong>${festival.title}</strong><br>
                                        </div>
                                        <img src="${festival.firstimage2}" alt="${festival.title}" 
                                            style="width: 100%; object-fit: cover; max-height: 150px; display: block; margin: 0 auto 3px;">
                                        <div style="padding: 0 10px; text-align: left; margin-top: 3px; word-wrap: break-word; white-space: normal; font-size: 13px;">
                                            ${festival.addr1}<br>
                                            <span style="font-size: 12px; color: #555;">${festival.eventstartdate} ~ ${festival.eventenddate}</span>
                                        </div>
                                    </div>`;

                                    // 여기까지 수정
                                    // 인포윈도우 생성 코드 삭제

                                    // 마커에 마우스를 올렸을 때 인포윈도우 표시
                                    kakao.maps.event.addListener(marker, 'mouseover', function () {
                                        globalInfowindow.setContent(infoContent);
                                        globalInfowindow.open(map, marker);
                                    });

                                    // 마커에서 마우스를 뗐을 때 인포윈도우 닫기
                                    kakao.maps.event.addListener(marker, 'mouseout', function () {
                                        globalInfowindow.close();
                                    });

                                    // 마커 클릭 이벤트
                                    kakao.maps.event.addListener(marker, 'click', function () {
                                        console.log('Marker clicked');  // 마커 클릭 시 호출 확인
                                        console.log('Calling InfoMapToPanel function');  // 함수 호출 로그

                                        // 마커의 위치로 지도 중심 이동 및 확대
                                        map.setLevel(7);
                                        map.panTo(markerPosition);

                                        window.map.markers.forEach(function(m) {
                                            if(m !== marker) {
                                                m.setVisible(false);
                                            }
                                            else {
                                                m.setVisible(true);
                                            }
                                        });

                                        // 마커 클릭 시 축제 정보를 패널에 업데이트하는 함수 호출
                                        InfoMapToPanel(festival);  // 이 함수에서 축제 정보가 패널에 표시되도록 처리

                                        globalInfowindow.setContent(infoContent);
                                        globalInfowindow.open(map, marker);
                                    });
                                });

                                // 초기 필터링 적용 (현재 진행 중인 축제만 보이도록)
                                // 이미 초기 로드 시 설정했으므로 별도 호출 필요 없음
                            })
                            .catch(error => {
                                console.error('Error fetching festivals data:', error);
                            });
                    });
                </script>

    <script>
        // 모든 버튼 및 정보 요소 선택
        const leftPanel = document.querySelector(".left-panel");

        const restaurantBTN = document.querySelector(".restaurantBTN");
        const restaurantInfo = document.getElementById("restaurant");

        // 왼쪽 패널 확장을 위한 사진버튼 요소 선택
        const moreInfo = document.querySelector(".more-info");

        // 모든 정보 요소들을 배열로 묶음
        const infoSections = [festivalInfo, trafficInfo, hotelInfo, restaurantInfo];
        // 각 카테고리별 사진 버튼을 눌렀을 때의 이벤트리스너 생성

        // 사진버튼 클릭 시 왼쪽 패널 확대/축소
        moreInfo.addEventListener('click', () => {
            leftPanel.classList.toggle('expanded');
            if (leftPanel.style.width === '33.33%') { // col-md-4
                leftPanel.style.width = '58.33%'; // col-md-7
                rightPanel.style.width = '41.67%'; // col-5
            } else {
                leftPanel.style.width = '33.33%'; // col-md-4
                rightPanel.style.width = '66.67%'; // col-8
            }
        });

        // 공통 함수: 모든 정보 숨기기
        function hideAllInfo() {
            infoSections.forEach(info => {
                info.classList.add('hidden'); // 모든 정보를 숨김
            });
        }

     // 축제 정보 버튼 클릭 이벤트
        // 수정
        festivalBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            festivalInfo.classList.toggle('hidden'); // 축제 정보만 토글
        });

        // 수정
        hotelBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            hotelInfo.classList.toggle('hidden'); // 숙소 정보만 토글
        });
        
        restaurantBTN.addEventListener('click', () => {
            hideAllInfo(); // 다른 정보 모두 숨기기
            restaurantInfo.classList.toggle('hidden'); // 음식점 정보만 토글
        });

        // 뒤로가기 버튼 클릭 시
        // 수정 (추가)
        document.addEventListener('DOMContentLoaded', function () {
            const restoreSearchButton = document.getElementById('restoreSearchButton');

            restoreSearchButton.addEventListener('click', function () {
                console.log('뒤로가기 버튼 클릭');

                // 숙소와 주변 맛집의 마커 제거
                if (typeof window.removeRestaurantMarkers === 'function') {
                    window.removeRestaurantMarkers();
                    console.log('주변 맛집 마커 제거됨.');
                }
                if (typeof window.removeHotelMarkers === 'function') {
                    window.removeHotelMarkers();
                    console.log('숙소 마커 제거됨.');
                }

                // 숙소와 주변 맛집 패널 초기화
                if (typeof window.clearHotelPanel === 'function') {
                    window.clearHotelPanel();
                    console.log('숙소 패널 초기화됨.');
                }
                if (typeof window.clearRestaurantPanel === 'function') {
                    window.clearRestaurantPanel();
                    console.log('주변 맛집 패널 초기화됨.');
                }

                // 지도 중심과 레벨 초기화
                if (window.map && window.map.map) {
                    window.map.map.setCenter(new kakao.maps.LatLng(36.5, 127.5));
                    window.map.map.setLevel(12);
                    console.log('지도 중심과 레벨 초기화됨.');
                } else {
                    console.warn('지도 인스턴스가 발견되지 않음.');
                }

                // 마지막 검색어로 다시 검색 수행
                if (window.lastSearchTerm !== undefined && window.lastSearchTerm !== null) {
                    window.performSearch(window.lastSearchTerm);
                    console.log('마지막 검색어로 검색 재실행됨:', window.lastSearchTerm);
                } else {
                    console.warn('마지막 검색어가 존재하지 않음.');
                }
            });
        });
    </script>
</body>
</html>
