<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/login/login.css">
    <title>로그인</title>
</head>

<body>
    <div class="container">
        <form th:action="@{/login}" method="post" class="text-center">
            <h2 style="color: #007bff;">ENJOY</h2>
            <div class="light-horizontal-line"></div>
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" id="username" name="username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control">
            </div>
            <div>
                <button type="submit" class="btn btn-primary text-white" id="login">로그인</button>
            </div>
            <div class="link-group">
                <a href="http://localhost:8080/signup" class="link-item">회원가입</a>
                <a href="http://localhost:8080/findById" class="link-item">아이디 찾기</a>
                <a href="http://localhost:8080/findByPw" class="link-item">비밀번호 찾기</a>
            </div>
        </form>
    </div>
</body>

</html>
